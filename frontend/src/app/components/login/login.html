<div class="login-page">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <p class="sub">Gestor de Coberturas</p>

    <input [(ngModel)]="username" placeholder="Usuario" class="field" />
    <input [(ngModel)]="password" type="password" placeholder="Contraseña" class="field" />
    <button (click)="onLogin()" class="btn-login">Ingresar</button>

    @if (mensaje) {
      <p class="msg">{{ mensaje }}</p>
    }
  </div>
</div>
